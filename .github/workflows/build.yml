name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

      # - name: Test
      #   run: go test -v ./...
